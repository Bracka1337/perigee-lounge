services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: perigee_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - cache_data:/var/www/html/bootstrap/cache
    environment:
      AUTO_SETUP: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 3s
      timeout: 2s
      retries: 60

  # Same image as app: runs queued mail and Telegram messages.
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: perigee_queue
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3
    volumes:
      - ./:/var/www/html
      - cache_data:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy

  # Runs scheduled commands, such as expiring late reservations.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: perigee_scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
      - cache_data:/var/www/html/bootstrap/cache
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: perigee_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - cache_data:/var/www/html/bootstrap/cache
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: perigee_db
    ports:
      - "33060:3306"
    environment:
      MYSQL_DATABASE: perigee
      MYSQL_USER: perigee
      MYSQL_PASSWORD: perigee_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 30

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    profiles: ["build"]
    command: sh -lc "npm ci --include=dev && npm run build"

volumes:
  dbdata:
  storage_data:
  cache_data:
