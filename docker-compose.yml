# Real environment variables win over .env, so the containers always use MySQL.
x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:${APP_PORT:-8081}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: perigee
  DB_USERNAME: perigee
  DB_PASSWORD: perigee_pass
  MAIL_MAILER: log

# app, queue and scheduler share one image.
x-app: &app
  build:
    context: .
    target: app
  image: perigee-lounge-app
  environment: *app-env
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 3s
      timeout: 2s
      retries: 100

  # Runs queued mail and Telegram messages.
  queue:
    <<: *app
    command: php artisan queue:work --tries=3
    depends_on:
      app:
        condition: service_healthy

  # Runs scheduled commands, such as expiring late reservations.
  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.4
    ports:
      # 33060 is MySQL's own X Protocol port and clashes with a local MySQL.
      - "${DB_FORWARD_PORT:-33061}:3306"
    environment:
      MYSQL_DATABASE: perigee
      MYSQL_USER: perigee
      MYSQL_PASSWORD: perigee_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uperigee", "-pperigee_pass"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  dbdata:
  storage:
